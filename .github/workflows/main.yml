name: Build Minebot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Java 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x minebot_natural/gradlew

    - name: Create Minecraft cache dirs
      run: |
        mkdir -p /home/runner/.gradle/caches/minecraft/net/minecraft/minecraft/1.8
        mkdir -p /home/runner/.gradle/caches/minecraft/net/minecraft/minecraft_merged/1.8

    - name: Download Minecraft 1.8 jar
      run: |
        mkdir -p /home/runner/.gradle/caches/minecraft/net/minecraft/minecraft/1.8
        MANIFEST=$(curl -s https://launchermeta.mojang.com/mc/game/version_manifest.json)
        URL=$(echo $MANIFEST | python3 -c "import sys,json; versions=json.load(sys.stdin)['versions']; print([v['url'] for v in versions if v['id']=='1.8'][0])")
        CLIENT=$(curl -s $URL | python3 -c "import sys,json; print(json.load(sys.stdin)['downloads']['client']['url'])")
        wget -O /home/runner/.gradle/caches/minecraft/net/minecraft/minecraft/1.8/minecraft-1.8.jar "$CLIENT"

    - name: Setup workspace
      working-directory: minebot_natural
      run: ./gradlew setupDecompWorkspace --no-daemon -x getAssetsIndex -x getAssets -x downloadClient -x downloadServer -x extractUserDev
      
    - name: Build
      working-directory: minebot_natural
      run: ./gradlew build --no-daemon -x getAssetsIndex -x getAssets

    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: Minebot-natural
        path: minebot_natural/build/libs/*.jar
