name: Build Minebot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Java 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x minebot_natural/gradlew

    - name: Setup workspace
      working-directory: minebot_natural
      run: ./gradlew setupDecompWorkspace --no-daemon

    - name: Build
      working-directory: minebot_natural
      run: ./gradlew build --no-daemon

    - name: Upload JAR
      uses: actions/upload-artifact@v3
      with:
        name: Minebot-natural
        path: minebot_natural/build/libs/*.jar
